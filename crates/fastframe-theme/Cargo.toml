[package]
name = "fastframe-theme"
description = "JSON colour palettes, a background palette catalogue, shared palettes and Omarchy theme following for egui apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["egui", "theme", "palette", "omarchy"]
categories = ["gui"]

[dependencies]
egui.workspace = true
# Palette files, the settings cache, and Omarchy's rendered palettes. Both
# are already in every app.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Filesystem notifications for the themes folder and Omarchy's current
# theme. ZapFast already uses this version.
notify = "8.2"
# The home directory Omarchy keeps its state in. Already in both apps.
directories = "6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
