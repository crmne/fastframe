[package]
name = "fastframe-graphics"
description = "Open an egui window on the graphics a computer has: fall back from OpenGL to wgpu, and say in a native dialog why no window opens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["egui", "eframe", "opengl", "wgpu", "desktop"]
categories = ["gui"]

[features]
## Enable eframe's wgpu renderer: Metal first on macOS, with OpenGL as the
## fallback; Direct3D 12 on Windows (including WARP without a vendor driver)
## and Vulkan or OpenGL ES on Linux when OpenGL cannot draw the window.
## It adds several megabytes to the app's build, so each app chooses it.
wgpu = ["eframe/wgpu"]

[dependencies]
# The renderer choice and the errors `run_native` returns. glow is the
# renderer every app uses; the workspace's eframe names it.
eframe.workspace = true
# One warning when the first renderer fails and the next is tried.
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# NSAlert and NSWorkspace for the dialog and its help link. The tray and the
# shell already bring these versions.
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSAlert", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# MessageBoxW for the dialog, ShellExecuteW for its link, and IsWow64Process2
# for Windows on ARM under an x64 build. Already in
# every app's tree.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
eframe = { workspace = true, features = ["default_fonts"] }
# The window example prints the fallback's warning and the dialog's error.
env_logger.workspace = true

# The dialogs need native calls, allowed only in their platform modules, each
# block with a SAFETY note.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
