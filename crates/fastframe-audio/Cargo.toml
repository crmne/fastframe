[package]
name = "fastframe-audio"
description = "Audio output and input for egui apps: a device stream that really idles when paused, follows the default device and reopens after failures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["audio", "cpal", "output", "input", "egui"]
categories = ["multimedia::audio"]

[features]
# Kept so apps that named them still build. On Linux both hosts are always
# compiled in (below); elsewhere cpal has no such hosts.
pulseaudio = ["cpal/pulseaudio"]
pipewire = ["cpal/pipewire"]
# `MixerRender`: a renderer that plays rodio's mixer, for apps that mix with
# rodio. Off by default.
rodio = ["dep:rodio"]

[dependencies]
# The device stream. 0.18 is the version Solco builds with and kira 0.12
# requires; Spotifast and ZapFast reach cpal through rodio today.
#
# From crmne/cpal's `stream-metadata-0.18` branch (cpal 0.18.2 with the
# app and stream names of RustAudio/cpal#1409), the one fork dependency the
# maintainer approved (AGENTS.md). It is carried until a cpal release
# includes #1409 or its successor, then goes back to crates.io. Apps that
# also get cpal 0.18 from crates.io (kira, or cpal itself) patch it to the
# same rev, so they build one cpal.
cpal = { git = "https://github.com/crmne/cpal", rev = "fcd8b6ebee9d822426fa8d6839cdd89af6e0d491" }
# Device changes, reopens and errors are logged as the other crates log.
log.workspace = true
# rodio's mixer, for `MixerRender` (the `rodio` feature). 0.21 is the version
# Spotifast mixes with. Without default features, so neither its `playback`
# (which would bring cpal 0.16 and a second output stream) nor its decoders
# come in: only the mixer and sources, on `dasp_sample` and `num-rational`.
rodio = { version = "0.21", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Registers the stream's thread with the Multimedia Class Scheduler Service.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

# Raises the feeding thread's QoS class (macOS) or nice value (Linux). Already
# in every app's tree, through cpal among others.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

# Asks RTKit to make the callback's thread real-time (`realtime.rs`). Pure
# Rust, already in the apps' trees through fastframe-desktop and -text, where
# cpal's own `realtime-dbus` would link the C libdbus. Its own small executor,
# as in fastframe-desktop; apps that enable zbus's tokio feature keep it.
[target.'cfg(target_os = "linux")'.dependencies]
# Every app's output goes to the sound server itself, never through ALSA's
# `pipewire`, `pulse` or `default` plugins: cpal's default host is then
# PipeWire, then PulseAudio (pure Rust, whose fixed buffer replaces
# PulseAudio's ~2 s default target), then ALSA. Only the server hosts and
# ALSA `hw` devices get a real-time callback (`plan::realtime_eligible`), so
# without these an ordinary desktop would never get one. The PipeWire host
# builds bindings against libpipewire, so Linux builds need its headers and
# clang (`libpipewire-0.3-dev clang libclang-dev` on Debian and Ubuntu).
# The same fork rev as above.
cpal = { git = "https://github.com/crmne/cpal", rev = "fcd8b6ebee9d822426fa8d6839cdd89af6e0d491", features = ["pipewire", "pulseaudio"] }
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }

[[example]]
name = "mixer"
required-features = ["rodio"]

# The workspace forbids unsafe code. Joining MMCSS and raising a thread's
# priority are one OS call each, so this crate carries the workspace's lints
# with `unsafe_code` lowered to `deny`, allowed only in `mmcss.rs`,
# `feeder.rs` and `realtime.rs`, with a SAFETY note on each call, and in the
# test-only `allocations.rs`, whose counting allocator is an `unsafe impl`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
