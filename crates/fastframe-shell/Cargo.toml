[package]
name = "fastframe-shell"
description = "Keep an egui app running without a window, recreate the window on demand, open it where it was, and bring back windows restored off-screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["egui", "eframe", "tray", "background", "desktop"]
categories = ["gui"]

[dependencies]
# `Waker` repaints through the window's context; recovery asks it to move.
egui.workspace = true
# `Frame::winit_window`, for the window and monitor positions recovery reads.
eframe.workspace = true
# One warning when a window is moved back on screen, and the stall warnings.
log.workspace = true
# `Shell::run` marks its thread, so a save that would freeze the window is
# caught. Every app on the shell saves through it already.
fastframe-file = { path = "../fastframe-file" }

[target.'cfg(target_os = "linux")'.dependencies]
# Reads `niri msg --json windows` and `hyprctl clients -j` to find this
# process's window. Already in every app's tree.
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The screens' visible frames, which a window's title bar must stay on.
# winit's macOS monitor positions mix scale factors, and AppKit is the only
# one to ask before the window exists. The tray already brings these.
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSScreen"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSEnumerator", "NSGeometry"] }

[target.'cfg(windows)'.dependencies]
# The headless sleep waits on the thread's messages as well as the waker:
# winit's event-target window (visible, 0x0, layered) lives on this thread
# for the whole run, and Windows calls a thread that leaves it unanswered
# for five seconds hung (IsHungAppWindow, Process.Responding). Already in
# every app's tree.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The interactive lifecycle regression creates a real tray and native windows.
fastframe-tray = { path = "../fastframe-tray" }
eframe = { workspace = true, features = ["default_fonts"] }
# The niri and Hyprland parsers' tests run on every platform.
serde_json.workspace = true

# The workspace's lints with `unsafe_code` lowered to `deny`, allowed only in
# the module that talks to the OS (`windows.rs`), each block with a SAFETY
# note.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
