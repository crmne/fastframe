[package]
name = "fastframe-scroll"
description = "Scrolling for egui apps that feels like the platform's: a wheel step like other apps', and touchpad gestures on Linux that keep their speed, glide after the lift, and hold one axis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["egui", "scroll", "touchpad", "kinetic", "desktop"]
categories = ["gui"]

[dependencies]
# Reads the frame's wheel events and rewrites its smooth scroll delta.
egui.workspace = true

[target.'cfg(windows)'.dependencies]
# Reads how many lines a wheel notch scrolls (SPI_GETWHEELSCROLLLINES).
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

# The workspace's lints with `unsafe_code` lowered to `deny`, allowed only in
# the module that reads the Windows setting (`windows.rs`), with a SAFETY
# note.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
