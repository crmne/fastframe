[workspace]
resolver = "3"
# `tests/*` are unpublished app-shaped fixtures that exercise build-time
# helpers the way an app does.
members = ["crates/*", "tests/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Carmine Paolino <carmine@paolino.me>"]
repository = "https://github.com/crmne/fastframe"
homepage = "https://github.com/crmne/fastframe"

[workspace.dependencies]
# Stock egui 0.36.1 already has per-font hinting targets and sub-pixel
# binning (emilk/egui#8262). Apps patch egui to their fork at the app root;
# the fork is based on 0.36.1 and keeps the same API.
egui = { version = "0.36.1", default-features = false }
# D-Bus for the desktop portal. Already in every app that talks to the
# session bus; the tokio backend matches theirs, so no second executor.
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "tokio"] }

# Logging (fastframe-log): the versions ZapFast and Spotifast build with.
log = { version = "0.4", features = ["std"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
jiff = "0.2"

# The keep-running shell (fastframe-shell). `Frame::winit_window`, for the
# window and monitor positions off-screen recovery reads. eframe does not
# compile on macOS without a renderer, so this names glow, which every app
# uses.
eframe = { version = "0.36.1", default-features = false, features = ["glow", "wayland", "x11"] }

# The tray (fastframe-tray): the versions ZapFast and Spotifast build with.
ksni = { version = "0.3", features = ["blocking"] }
tray-icon = { version = "0.24", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
# macOS window chrome (fastframe-macos): the version eframe itself uses.
raw-window-handle = "0.6"
# Win32 calls (fastframe-fonts, fastframe-tray, fastframe-update). arboard,
# under egui-winit, already brings this version; each crate names the
# features it calls.
windows-sys = "0.60"

# Shared by several crates, at the versions every app already builds.
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
